services:
  lalune-panel:
    # pull the prebuilt GHCR image by default;
    # comment `image:` and uncomment `build:` to build locally instead
    image: ghcr.io/endlad2/lalunepanel:latest
    # build: .
    container_name: lalune-panel
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - ./data:/data
    environment:
      LALUNE_DATA_DIR: /data
      LALUNE_LISTEN: ":6333"
